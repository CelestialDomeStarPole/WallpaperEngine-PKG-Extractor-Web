<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Wallpaper Engine PKG 提取器">
  <defs>
    <linearGradient id="plate" x1="4" y1="0" x2="60" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#26374f"/>
      <stop offset=".5" stop-color="#0e1622"/>
      <stop offset="1" stop-color="#04070c"/>
    </linearGradient>
    <linearGradient id="gloss" x1="32" y1="0" x2="32" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".2"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sheet" x1="15" y1="11" x2="49" y2="37" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f4faff"/>
      <stop offset="1" stop-color="#a9cdec"/>
    </linearGradient>
    <linearGradient id="ridge" x1="15" y1="21" x2="49" y2="37" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1c4f7d"/>
      <stop offset="1" stop-color="#0a1c2e"/>
    </linearGradient>
    <linearGradient id="tray" x1="32" y1="37" x2="32" y2="55" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".34"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".1"/>
    </linearGradient>
    <linearGradient id="rim" x1="11" y1="37" x2="53" y2="37" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#a8daff"/>
      <stop offset=".5" stop-color="#7cc4ff"/>
      <stop offset="1" stop-color="#3f81c4"/>
    </linearGradient>
    <clipPath id="plateClip">
      <rect width="64" height="64" rx="15"/>
    </clipPath>
    <clipPath id="sheetClip">
      <rect x="15" y="11" width="34" height="26" rx="4.5"/>
    </clipPath>
  </defs>

  <g clip-path="url(#plateClip)">
    <rect width="64" height="64" fill="url(#plate)"/>
    <path d="M0 0h64v22c-10 6-22 8-32 8S10 28 0 22Z" fill="url(#gloss)"/>

    <!-- 壁纸切片：山＋日 -->
    <g clip-path="url(#sheetClip)">
      <rect x="15" y="11" width="34" height="26" fill="url(#sheet)"/>
      <circle cx="41.5" cy="17" r="3.2" fill="#3f81c4"/>
      <path d="M11 40 25 21l5.5 7L34 23.5 53 40Z" fill="url(#ridge)"/>
    </g>
    <rect x="15" y="11" width="34" height="26" rx="4.5" fill="none" stroke="#04070c" stroke-opacity=".38" stroke-width="1.9"/>
    <rect x="15" y="11" width="34" height="26" rx="4.5" fill="none" stroke="#eaf4ff" stroke-opacity=".55" stroke-width="1.1"/>

    <!-- 承接的托盘：半透明玻璃，切片从其后方露出 -->
    <rect x="9" y="37" width="46" height="18" rx="5.5" fill="url(#tray)"/>
    <rect x="9" y="37" width="46" height="18" rx="5.5" fill="none" stroke="#eaf4ff" stroke-opacity=".4" stroke-width="1.4"/>
    <path d="M11.5 37h41" fill="none" stroke="url(#rim)" stroke-width="3.2" stroke-linecap="round"/>
    <path d="M10 50.5h44" fill="none" stroke="#04070c" stroke-opacity=".16" stroke-width="1.2"/>

    <rect x=".9" y=".9" width="62.2" height="62.2" rx="14.1" fill="none" stroke="#ffffff" stroke-opacity=".3" stroke-width="1.8"/>
  </g>
</svg>
